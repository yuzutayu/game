<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101428">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="ゲームごとに日課を登録して毎日チェック。更新時刻に合わせて自動リセットするデイリー管理ツール。">
  <title>デイリーボード | ゲームの日課管理</title>
  <!-- iPhone・Android用PWA設定：相対パスなのでGitHub Pagesのサブフォルダでも動きます -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <style>
    :root{color-scheme:dark;--bg:#0c1020;--card:#171d33;--card2:#1f2842;--line:#303955;--text:#f5f7ff;--muted:#a1adca;--accent:#93edce;--shadow:0 18px 56px rgba(0,0,0,.22)}
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    html{scroll-behavior:smooth}
    body{margin:0;background:radial-gradient(ellipse 90% 420px at 75% -150px,rgba(131,110,232,.24),transparent 77%),radial-gradient(ellipse 560px 380px at -90px 300px,rgba(89,175,187,.08),transparent),var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;line-height:1.5;color:var(--text);min-height:100dvh;-webkit-font-smoothing:antialiased}
    button,input,select{font:inherit}
    button{cursor:pointer;touch-action:manipulation}
    button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8de8d0;outline-offset:3px}
    button:disabled{opacity:.5;cursor:not-allowed}
    .container{max-width:850px;margin:0 auto;padding:max(24px,calc(env(safe-area-inset-top) + 16px)) 16px max(66px,calc(env(safe-area-inset-bottom) + 24px))}
    .header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
    .brand{display:flex;align-items:center;gap:13px}
    .brand-mark{display:grid;place-items:center;width:49px;height:49px;border:1px solid rgba(164,252,216,.45);border-radius:16px;background:linear-gradient(140deg,#283c53,#24473e);font-size:25px;box-shadow:0 9px 25px rgba(0,0,0,.22)}
    h1{font-size:clamp(21px,5vw,29px);line-height:1.25;letter-spacing:-.035em;margin:0;font-weight:800}
    .subtitle{font-size:12px;color:var(--muted);margin-top:5px}
    .btn{appearance:none;border:1px solid var(--line);background:#202940;color:var(--text);border-radius:13px;min-height:43px;padding:10px 15px;font-size:13px;font-weight:700;transition:background .15s,border-color .15s,transform .15s;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
    .btn:hover{background:#2b3550;border-color:#51617d}
    .btn:active{transform:scale(.985)}
    .btn-primary{background:#a1f0d5;color:#102820;border-color:transparent}
    .btn-primary:hover{background:#bdffe8;border-color:transparent}
    .btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
    .btn-ghost:hover{background:#252d44;color:var(--text)}
    .btn-danger{border-color:#a14b62;background:#51273b;color:#ffe3e9}
    .btn-danger:hover{background:#673049}
    .btn-icon{width:44px;min-width:44px;padding:0;font-size:19px}
    .top-actions{display:flex;gap:5px;align-items:center}
    .hero{background:linear-gradient(120deg,rgba(39,65,67,.78),rgba(34,38,76,.94));border:1px solid #40506a;border-radius:23px;padding:22px;box-shadow:var(--shadow);margin-bottom:21px;overflow:hidden;position:relative}
    .hero-top,.hero-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative;z-index:1}
    .eyebrow{font-size:12px;color:#b6dccc;font-weight:700;letter-spacing:.05em}
    .hero-number{font-size:37px;font-weight:850;letter-spacing:-.055em;line-height:1.3}
    .hero-number span{font-size:17px;color:#bbc7dc;font-weight:600;letter-spacing:0}
    .hero-note{font-size:12px;color:#bcc8df;margin:4px 0 0}
    .hero-meter{width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--accent) var(--pct),rgba(255,255,255,.1) 0);display:grid;place-items:center;flex:none}
    .hero-meter:before{content:"";position:absolute;width:72px;height:72px;border-radius:50%;background:#23334a}
    .hero-pct{z-index:1;font-weight:850;font-size:22px}
    .bar{height:7px;background:#303950;border-radius:99px;overflow:hidden}
    .bar>span{display:block;height:100%;background:linear-gradient(90deg,#74d6c0,#b1f4cf);border-radius:inherit;transition:width .2s}
    .hero-bottom{margin-top:15px}
    .hero-tabs{display:flex;align-items:center;gap:4px;position:relative;z-index:2;margin:0 0 16px;padding:4px;border:1px solid rgba(255,255,255,.16);background:rgba(7,15,29,.4);border-radius:12px;width:max-content;max-width:100%}
    .hero-tab{border:0;border-radius:9px;min-height:36px;padding:8px 13px;background:transparent;color:#cbd8e9;font-size:12px;font-weight:750;white-space:nowrap}
    .hero-tab.active{color:#113527;background:#b0f5da}
    .hero-tab:focus-visible{outline:3px solid #a4f6dc;outline-offset:2px}
    .notification-mode-tip{background:#14243a;border:1px solid #39536d;border-radius:11px;padding:10px 12px;font-size:12px;color:#c8e1eb;line-height:1.7;margin:0 0 16px}
    .notification-mode-tip strong{color:#b9f9df}
    .status-pill{font-size:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#d7e3f3;padding:7px 11px;border-radius:99px}
    .section-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 12px}
    .section-title{margin:0;font-size:17px;letter-spacing:-.02em}
    .section-meta{font-size:12px;color:var(--muted)}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap;margin-bottom:16px}
    .segments{display:flex;gap:3px;padding:4px;border:1px solid var(--line);background:#131a2f;border-radius:13px;max-width:100%;overflow-x:auto}
    .segment{border:0;background:transparent;color:#aab6d1;border-radius:9px;padding:9px 12px;min-height:38px;white-space:nowrap;font-size:12px;font-weight:700}
    .segment.active{background:#36435d;color:#fff}
    .mini-toggle{display:flex;align-items:center;gap:8px;color:#c6cee0;font-size:12px;user-select:none;cursor:pointer}
    .mini-toggle input{appearance:none;background:#242d45;width:35px;height:21px;border-radius:20px;border:1px solid #52607a;position:relative;margin:0}
    .mini-toggle input:before{content:"";position:absolute;background:#bdc7df;border-radius:50%;width:15px;height:15px;left:2px;top:2px;transition:transform .2s}
    .mini-toggle input:checked{background:#477f77;border-color:#7fdac2}
    .mini-toggle input:checked:before{transform:translateX(14px);background:#f5fff9}
    .games{display:flex;flex-direction:column;gap:14px}
    .game{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 9px 34px rgba(0,0,0,.1)}
    .game.is-done{border-color:#47665e}
    .game-head{display:flex;align-items:center;gap:12px;padding:15px 15px 12px}
    .game-emoji{width:49px;min-width:49px;height:49px;border-radius:14px;background:var(--game-tone,#364966);display:grid;place-items:center;font-size:26px;overflow:hidden;flex-shrink:0}
    .game-cover{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
    .icon-picker{display:flex;align-items:center;gap:14px;background:#151e33;border:1px solid #364461;border-radius:15px;padding:12px;margin-bottom:12px}
    .icon-preview{width:70px;min-width:70px;height:70px;border-radius:18px;font-size:34px}
    .icon-picker-info{min-width:0;flex:1}
    .icon-picker-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
    .icon-picker-actions .btn{min-height:37px;padding:7px 11px;font-size:12px}
    .icon-picker-actions label.btn{display:inline-flex;margin:0;color:var(--text);cursor:pointer}
    .icon-hint{font-size:11px;color:var(--muted);line-height:1.6;margin-top:6px}
    .crop-panel{margin:12px 0 17px;padding:14px;background:#111a2d;border:1px solid #53617b;border-radius:16px}
    .crop-panel[hidden]{display:none!important}
    .crop-canvas{width:min(100%,280px);height:auto;aspect-ratio:1/1;display:block;margin:8px auto;border-radius:12px;border:2px solid #9ce9d3;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
    .crop-canvas:active{cursor:grabbing}
    .crop-zoom{width:100%;accent-color:#9ce9d3;min-height:36px}
    .crop-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
    .crop-actions .btn-primary{flex:1}

    .task-modal-game{display:flex;align-items:center;gap:9px}
    .task-modal-icon{width:31px;min-width:31px;height:31px;border-radius:9px;font-size:18px}
    .game-heading{min-width:0;flex:1}
    .game-name{font-weight:800;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
    .game-meta{font-size:11px;color:#a8b4ce;margin-top:5px}
    .game-head-buttons{display:flex;gap:2px;align-items:center}
    .game-mini{color:#b4bed4;border:0;background:transparent;padding:4px;border-radius:10px;min-width:36px;height:38px;font-size:21px}
    .game-mini:hover{background:#2c3550}
    .game-body{padding:0 15px 15px}
    .game-progress{display:flex;align-items:center;gap:11px;margin:0 0 13px}
    .game-progress .bar{flex:1;height:6px}
    .game-progress-text{font-size:11px;color:#c4cee1;white-space:nowrap;min-width:52px;text-align:right}
    .task-list{display:flex;flex-direction:column;gap:7px}
    .task{display:flex;align-items:center;gap:8px;background:#202841;border:1px solid #2b3551;border-radius:12px;min-height:52px;padding:6px 7px 6px 10px}
    .task.is-checked{background:#1a302e;border-color:#325a4f}
    .task-check{border:0;background:transparent;color:#eff5ff;display:flex;align-items:center;gap:12px;min-width:0;flex:1;text-align:left;padding:5px 0;min-height:40px}
    .check-box{display:grid;place-items:center;width:23px;height:23px;flex:none;border:2px solid #75839e;border-radius:7px;font-size:15px;color:#0b3427;font-weight:900}
    .is-checked .check-box{background:#a0f0d5;border-color:#a0f0d5}
    .task-name{font-size:14px;overflow-wrap:anywhere}
    .is-checked .task-name{text-decoration:line-through;color:#9eb7b4}
    .task-tag{font-size:10px;color:#b8c3dd;border:1px solid #41506e;padding:3px 7px;border-radius:7px;flex:none}
    .task-edit{width:34px;height:37px;flex:none;border:0;background:transparent;color:#bdc7e0;border-radius:9px;font-size:19px}
    .task-edit:hover{background:#35415c}
    .add-task{margin-top:10px;border:1px dashed #56637e;background:transparent;color:#b9e0d7;width:100%;padding:11px;border-radius:12px;min-height:43px;font-size:13px;font-weight:700}
    .add-task:hover{background:#233940}
    .reminders{border:1px solid #bd795d;background:linear-gradient(115deg,#41302f,#362842);border-radius:18px;padding:15px;margin:-5px 0 20px;box-shadow:0 10px 25px rgba(0,0,0,.12)}
    .reminders[hidden]{display:none!important}
    .reminder-heading{font-size:15px;font-weight:800;margin:0 0 9px;color:#ffe8d7}
    .reminder-item{border-top:1px solid rgba(255,223,204,.17);padding:11px 0 5px}
    .reminder-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    .reminder-title{font-size:14px;font-weight:750;overflow-wrap:anywhere}
    .reminder-sub{font-size:12px;color:#f5cdbb;margin:5px 0 9px;line-height:1.6}
    .reminder-actions{display:flex;gap:7px;flex-wrap:wrap}
    .reminder-actions .btn{min-height:36px;padding:7px 12px;font-size:12px}
    .reminder-chip{display:inline-block;color:#ffd3b8;border:1px solid #80564c;border-radius:7px;padding:2px 6px;margin-left:5px;font-size:10px}
    .no-tasks{padding:12px 5px;color:var(--muted);font-size:13px;text-align:center}
    .game-closed .game-body{display:none}
    .game-closed .game-head{padding-bottom:15px}
    .empty{border:1px dashed #485670;background:#171d31;border-radius:19px;padding:32px 20px;text-align:center;color:var(--muted)}
    .empty .empty-icon{font-size:43px;line-height:1.3}
    .empty h2{color:#edf3ff;margin:10px 0 7px;font-size:20px}
    .empty p{font-size:13px;max-width:330px;margin:0 auto 18px;line-height:1.8}
    .footer{text-align:center;font-size:11px;color:#8d9ab5;margin-top:26px;line-height:1.9}
    .footer button{color:#b3ded6;border:0;background:transparent;text-decoration:underline;text-underline-offset:3px;padding:5px}
    .modal-overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,8,19,.74);backdrop-filter:blur(5px)}
    .modal{width:100%;max-width:550px;max-height:min(89dvh,820px);overflow:auto;background:#1b233b;border:1px solid #485573;border-radius:22px 22px 0 0;padding:20px 19px max(24px,env(safe-area-inset-bottom));box-shadow:0 -12px 50px rgba(0,0,0,.5)}
    .modal-header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:17px}
    .modal-header h2{font-size:20px;margin:0}
    .field{margin-bottom:16px}
    .field label{display:block;color:#dfe6f5;font-size:13px;font-weight:700;margin-bottom:8px}
    .field .hint{font-size:11px;color:#aab7d2;margin-top:6px;line-height:1.6}
    .input{width:100%;min-height:46px;background:#111a2d;color:#f6f8ff;border:1px solid #495773;border-radius:12px;padding:11px 13px;font-size:16px;outline:none}
    .input:focus{border-color:#9ce9d3;box-shadow:0 0 0 3px rgba(156,233,211,.12)}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .form-grid>.field{min-width:0}
    .form-grid .input{display:block;min-width:0;max-width:100%}
    @media(max-width:600px){.form-grid{grid-template-columns:minmax(0,1fr)}}
    .swatches{display:flex;flex-wrap:wrap;gap:9px}
    .swatch{width:34px;height:34px;border:3px solid transparent;border-radius:11px}
    .swatch.selected{outline:2px solid white;outline-offset:2px}
    .modal-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
    .modal-actions .btn-primary{flex:1}
    .section-help{color:#b9c7dd;font-size:12px;line-height:1.8;margin:0 0 17px}
    .passes-section{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;margin-bottom:13px;background:#1a2537;border:1px solid #45556a;border-radius:17px}
    .passes-mini{display:flex;align-items:center;gap:10px;min-width:0}
    .passes-mini-icon{font-size:27px}
    .passes-mini-text{display:flex;flex-direction:column;gap:4px;min-width:0}
    .passes-mini-text strong{font-size:14px;color:#effaf5}
    .passes-mini-text span{font-size:12px;color:#b0bfd5;overflow-wrap:anywhere}
    .pass-card{background:#141e33;border:1px solid #3a4965;border-radius:14px;padding:13px;margin:10px 0}
    .pass-card .pass-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
    .pass-card strong{overflow-wrap:anywhere}
    .pass-card small{color:#acbed3;display:block;margin-top:5px;line-height:1.65}
    .pass-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
    .pass-controls .btn{font-size:12px;min-height:37px}
    .pass-soon{color:#f3cd9e!important}
    .pass-expired{color:#ffbac1!important}
    .pass-checkboxes{display:flex;flex-wrap:wrap;gap:12px;margin-top:7px}
    .pass-checkboxes label{display:flex;align-items:center;gap:5px;color:#d5ddeb;font-size:13px}
    .settings-group{padding:14px 0;border-top:1px solid #33405c}
    .settings-group h3{font-size:14px;margin:0 0 7px}
    .settings-group p{font-size:12px;color:#acb9d3;line-height:1.8;margin:0 0 12px}
    .settings-group .btn{margin:2px 4px 3px 0}
    .note{font-size:11px;color:#a8b8ce}
    #toast{position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(18px);background:#d4fbe7;color:#163c2c;font-size:13px;font-weight:750;padding:12px 18px;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.35);z-index:50;opacity:0;pointer-events:none;transition:transform .18s,opacity .18s;max-width:90vw;text-align:center}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .sr-only{position:absolute!important;height:1px;width:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
    @media(min-width:650px){.container{padding-top:max(35px,calc(env(safe-area-inset-top) + 18px))}.hero{padding:27px 32px}.hero-number{font-size:43px}.modal-overlay{align-items:center}.modal{border-radius:20px;max-height:86dvh}.game-head{padding:18px 21px 14px}.game-body{padding:0 21px 20px}}
    @media(max-width:370px){.container{padding-left:12px;padding-right:12px}.header{gap:6px}.brand{gap:8px}.brand-mark{width:42px;height:42px;min-width:42px}.top-actions .btn-primary{font-size:12px;padding-left:9px;padding-right:9px}.game-head{gap:8px}.game-emoji{width:43px;min-width:43px;height:43px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">🎮</div>
        <div>
          <h1>デイリーボード</h1>
          <div class="subtitle" id="headerDate">今日のクエストを確認しよう</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn btn-icon" id="settingsButton" type="button" aria-label="設定とバックアップ" title="設定とバックアップ">⚙</button>
        <button class="btn btn-primary" id="newGameButton" type="button">＋ ゲーム</button>
      </div>
    </header>
    <section class="hero" aria-label="達成状況">
      <div class="hero-tabs" role="group" aria-label="達成率の表示切り替え">
        <button type="button" class="hero-tab active" data-summary="daily" aria-pressed="true">デイリー</button>
        <button type="button" class="hero-tab" data-summary="weekly" aria-pressed="false">ウィークリー</button>
        <button type="button" class="hero-tab" data-summary="all" aria-pressed="false">すべて</button>
      </div>
      <div class="hero-top">
        <div>
          <div class="eyebrow" id="heroEyebrow">DAILY QUESTS</div>
          <div class="hero-number" id="totalStats">0 <span>/ 0 完了</span></div>
          <div class="hero-note" id="heroNote">ゲームを追加して始めましょう</div>
        </div>
        <div class="hero-meter" id="heroMeter" style="--pct:0%"><span class="hero-pct" id="heroPercent">0%</span></div>
      </div>
      <div class="hero-bottom">
        <span class="status-pill" id="dailyInfo">☀ デイリーとウィークリーを管理</span>
      </div>
    </section>
    <section id="reminderAlerts" class="reminders" role="alert" aria-live="polite" hidden></section>
    <section class="passes-section" aria-label="月パスの期限管理">
      <div class="passes-mini"><span class="passes-mini-icon" aria-hidden="true">🎫</span><div class="passes-mini-text"><strong>月パス・更新リマインダー</strong><span id="passesSummary">月パスの期限を登録して忘れずチェック</span></div></div>
      <button type="button" class="btn" id="monthlyPassButton">管理する</button>
    </section>
    <div class="section-row">
      <h2 class="section-title">マイゲーム <span class="section-meta" id="gameCount">0 件</span></h2>
      <button class="btn btn-ghost" id="collapseButton" type="button">すべて閉じる</button>
    </div>
    <div class="toolbar">
      <div class="segments" role="group" aria-label="日課の種類">
        <button class="segment active" data-filter="all" aria-pressed="true">すべて</button>
        <button class="segment" data-filter="daily" aria-pressed="false">デイリー</button>
        <button class="segment" data-filter="weekly" aria-pressed="false">ウィークリー</button>
        <button class="segment" data-filter="once" aria-pressed="false">固定</button>
      </div>
      <label class="mini-toggle"><input type="checkbox" id="hideDone">未完了のみ</label>
    </div>
    <div id="games" class="games" aria-live="polite"></div>
    <footer class="footer">
      チェックはこのブラウザに自動保存されます。<br>
      <button type="button" id="backupFooter">バックアップ・使い方</button><br>
      ※データは端末間で自動同期されません。
    </footer>
  </main>
  <div id="modalRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input id="importFile" class="sr-only" type="file" accept=".json,application/json">
  <script>
  'use strict';
  (() => {
    const STORAGE_KEY = 'daily-board-games-v1';
    const SETTINGS_KEY = 'daily-board-preferences-v1';
    const REMINDERS_KEY = 'daily-board-reminders-dismissed-v1';
    const NOTIFY_SETTINGS_KEY = 'daily-board-notification-settings-v1';
    const PALETTE = ['#365f66','#5b4a83','#66536d','#655c45','#3f617b','#4d665b'];
    const dayNames = ['日','月','火','水','木','金','土'];
    const repeatNames = {daily:'デイリー',weekly:'ウィークリー',once:'固定'};
    const $ = selector => document.querySelector(selector);
    const escapeHTML = x => String(x ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const newId = () => (typeof crypto!=='undefined' && crypto.randomUUID) ? crypto.randomUUID() : 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);
    const safeTime = t => /^([01]\d|2[0-3]):[0-5]\d$/.test(String(t)) ? t : '05:00';
    const safeReminderTime = t => typeof t==='string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(t) ? t : '';
    const safeColor = c => PALETTE.includes(c) ? c : PALETTE[0];
    // 画像は端末内で小さなサムネイルに加工し、データURLとして保存します。
    // 復元ファイル中の任意のURLやSVGは受け付けません。
    const safeIconImage = value => typeof value==='string' &&
      value.length<=240000 && /^data:image\/(?:webp|jpeg|png);base64,[a-z0-9+/]+={0,2}$/i.test(value) ? value : '';
    const iconMarkup = game => safeIconImage(game.iconImage)
      ? `<img class="game-cover" src="${escapeHTML(game.iconImage)}" alt="">`
      : escapeHTML(game.icon || '🎮');
    const safeDay = d => Number.isInteger(+d) && +d>=0 && +d<=6 ? +d : 1;
    const validRepeat = t => ['daily','weekly','once'].includes(t) ? t : 'daily';
    const makeTask = (title,repeat='daily')=>({id:newId(),title,repeat,doneKeys:[]});
    const VALID_LEADS=[7,3,1,0];
    const validDate = value => {
      if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;
      const [y,m,d]=value.split('-').map(Number);
      const date=new Date(Date.UTC(y,m-1,d));
      return y>=2000&&y<=2099&&date.getUTCFullYear()===y&&date.getUTCMonth()===m-1&&date.getUTCDate()===d;
    };
    const safePass = pass => ({
      id:String(pass?.id||newId()).slice(0,150),
      name:String(pass?.name||'月パス').slice(0,60),
      expires:validDate(pass?.expires)?pass.expires:'',
      remindTime:safeReminderTime(pass?.remindTime)||'20:00',
      leadDays:Array.isArray(pass?.leadDays)?VALID_LEADS.filter(x=>pass.leadDays.includes(x)): [3,1,0],
      enabled:pass?.enabled!==false
    });
    function remainingDays(date,now=new Date()){
      const [y,m,d]=date.split('-').map(Number);
      const start=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
      return Math.round((Date.UTC(y,m-1,d)-start)/86400000);
    }
    function nextMonthDate(date){
      const [y,m,d]=date.split('-').map(Number);
      const last=new Date(Date.UTC(y,m+1,0)).getUTCDate();
      const later=new Date(Date.UTC(y,m,Math.min(d,last)));
      return ymd(new Date(later.getUTCFullYear(),later.getUTCMonth(),later.getUTCDate()));
    }
    let games=[];
    let prefs={filter:'all',hideDone:false,summaryView:'daily'};
    let collapsed=new Set();
    let lastSignature='';
    let toastTimer;
    let pendingIconImage='';
    let imageProcessing=false;
    let cropState=null;
    let dismissedReminders={};
    let notifySettings={scope:'perGame',dailyTime:'21:00',weeklyDay:0,includeWeekly:true};
    function safeNotifySettings(o){
      return {scope:o?.scope==='all'?'all':'perGame',
        dailyTime:safeReminderTime(o?.dailyTime)||'21:00',
        weeklyDay:safeDay(o?.weeklyDay??0),
        includeWeekly:o?.includeWeekly!==false};
    }
    function saveNotifySettings(){
      try{
        localStorage.setItem(NOTIFY_SETTINGS_KEY,JSON.stringify(notifySettings));
        window.dispatchEvent(new Event('daily-board:changed'));
        return true;
      }catch(e){notice('通知設定を保存できませんでした');return false;}
    }

    function load(){
      try{
        const raw=localStorage.getItem(STORAGE_KEY);
        if(raw){games=normalize(JSON.parse(raw)).games;}
      }catch(err){console.warn('保存データを読み込めませんでした',err);notice('保存データを読み込めませんでした。バックアップをご確認ください。');}
      try{
        const p=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}');
        prefs={filter:['all','daily','weekly','once'].includes(p.filter)?p.filter:'all',hideDone:!!p.hideDone,summaryView:['daily','weekly','all'].includes(p.summaryView)?p.summaryView:'daily'};
      }catch(_){/* default view */}
      try{
        notifySettings=safeNotifySettings(JSON.parse(localStorage.getItem(NOTIFY_SETTINGS_KEY)||'{}'));
      }catch(_){notifySettings=safeNotifySettings({});}
      try{
        const d=JSON.parse(localStorage.getItem(REMINDERS_KEY)||'{}');
        if(d && typeof d==='object' && !Array.isArray(d))dismissedReminders=d;
      }catch(_){/* default reminders */}
    }
    function saveDismissed(){
      try{localStorage.setItem(REMINDERS_KEY,JSON.stringify(dismissedReminders));}catch(_){/* notice might remain after reload */}
    }
    function normalize(obj){
      if(!obj || !Array.isArray(obj.games)) throw new Error('正しいデイリーボードのデータではありません');
      const used=new Set();
      function unique(v){let s=typeof v==='string'&&v.trim()?v:newId();if(used.has(s))s=newId();used.add(s);return s;}
      return {games:obj.games.slice(0,200).map(g=>({
        id:unique(g.id),
        name:String(g.name||'名称未設定').slice(0,60),
        icon:String(g.icon||'🎮').slice(0,12),
        iconImage:safeIconImage(g.iconImage),
        color:safeColor(g.color),
        resetTime:safeTime(g.resetTime),
        reminderTime:safeReminderTime(g.reminderTime),
        weeklyDay:safeDay(g.weeklyDay),
        weeklyReminderTime:safeReminderTime(g.weeklyReminderTime),
        weeklyReminderDay:safeDay(g.weeklyReminderDay ?? g.weeklyDay),
        passes:(Array.isArray(g.passes)?g.passes:[]).slice(0,30).map(safePass).filter(p=>p.expires),
        tasks:(Array.isArray(g.tasks)?g.tasks:[]).slice(0,600).map(t=>({
          id:unique(t.id),title:String(t.title||'無題の日課').slice(0,120),
          repeat:validRepeat(t.repeat),
          doneKeys:Array.isArray(t.doneKeys)?t.doneKeys.filter(x=>typeof x==='string' && (/^\d{4}-\d{2}-\d{2}$/.test(x)||x==='once')).slice(-400):
            (typeof t.doneKey==='string'&&t.doneKey?[t.doneKey]:[])
        }))
      }))};
    }
    function save(){
      try{localStorage.setItem(STORAGE_KEY,JSON.stringify({version:1,games}));window.dispatchEvent(new Event('daily-board:changed'));return true}
      catch(err){console.error(err);notice('保存できませんでした。空き容量やブラウザ設定を確認してください。');return false}
    }
    function savePrefs(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(prefs));}catch(_){}}
    const ymd = date => [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');
    function cycleKey(game,repeat,now=new Date()){
      if(repeat==='once')return 'once';
      const time=safeTime(game.resetTime).split(':').map(Number);
      const current=now.getHours()*60+now.getMinutes();
      const boundary=time[0]*60+time[1];
      const date=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12);
      if(current<boundary)date.setDate(date.getDate()-1);
      if(repeat==='weekly'){
        const diff=(date.getDay()-safeDay(game.weeklyDay)+7)%7;
        date.setDate(date.getDate()-diff);
      }
      return ymd(date);
    }
    function isDone(game,task,now=new Date()){
      return task.doneKeys.includes(cycleKey(game,task.repeat,now));
    }
    function remaining(game,repeat,now=new Date()){
      const [h,m]=safeTime(game.resetTime).split(':').map(Number);
      const d=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m,0,0);
      if(repeat==='weekly'){
        d.setDate(d.getDate()+(safeDay(game.weeklyDay)-d.getDay()+7)%7);
      }
      if(d.getTime()<=now.getTime())d.setDate(d.getDate()+(repeat==='weekly'?7:1));
      const mins=Math.ceil((d-now)/60000);
      const days=Math.floor(mins/1440),hours=Math.floor(mins%1440/60),minutes=mins%60;
      return days>0?`${days}日${hours}時間`:`${hours}時間${minutes}分`;
    }
    // ゲーム別モードでは、デイリーとウィークリーを別々に通知する。
    // 旧バージョンのゲーム内「一括」設定は廃止し、無視する。
    function reminderRules(game,now=new Date()){
      const result=[];
      const daily=safeReminderTime(game.reminderTime);
      const weekly=safeReminderTime(game.weeklyReminderTime);
      if(daily) result.push({kind:'daily',time:daily});
      if(weekly && now.getDay()===safeDay(game.weeklyReminderDay ?? game.weeklyDay)){
        result.push({kind:'weekly',time:weekly});
      }
      return result;
    }
    function reminderStatus(game,kind,now=new Date()){
      const rule=reminderRules(game,now).find(r=>r.kind===kind);
      if(!rule)return null;
      const {time}=rule;
      let key;
      if(kind==='daily'){
        const [rh,rm]=safeTime(game.resetTime).split(':').map(Number);
        const [h,m]=time.split(':').map(Number);
        const start=new Date(now.getFullYear(),now.getMonth(),now.getDate(),rh,rm,0,0);
        if(now<start)start.setDate(start.getDate()-1);
        const due=new Date(start.getFullYear(),start.getMonth(),start.getDate(),h,m,0,0);
        if(due<start)due.setDate(due.getDate()+1);
        if(now<due)return null;
        key='daily|'+cycleKey(game,'daily',now)+'|'+time;
      }else{
        const [h,m]=time.split(':').map(Number);
        if(now.getHours()*60+now.getMinutes()<h*60+m)return null;
        key=kind+'|'+ymd(now)+'|'+time;
      }
      const undone=game.tasks.filter(t=>t.repeat===kind&&!isDone(game,t,now));
      if(!undone.length)return null;
      if(dismissedReminders[game.id+'|'+kind]===key)return null;
      return {game,kind,undone,key,time};
    }
    function renderAlerts(now=new Date()){
      const node=$('#reminderAlerts');if(!node)return;
      if(notifySettings.scope==='all'){
        const stamp=ymd(now);
        const mins=now.getHours()*60+now.getMinutes();
        const [h,m]=notifySettings.dailyTime.split(':').map(Number);
        const weeklyToday=notifySettings.includeWeekly && now.getDay()===notifySettings.weeklyDay;
        const kinds=weeklyToday?['daily','weekly']:['daily'];
        const undone=games.flatMap(g=>g.tasks.filter(t=>kinds.includes(t.repeat)&&!isDone(g,t,now)).map(t=>({game:g,title:t.title,type:t.repeat})));
        const key=`${stamp}|${notifySettings.dailyTime}|${weeklyToday?'weekly':'daily'}`;
        const visible=mins>=h*60+m && undone.length && dismissedReminders['__global__']!==key;
        node.hidden=!visible;
        if(!visible){node.innerHTML='';return;}
        const gameCount=new Set(undone.map(x=>x.game.id)).size;
        node.innerHTML=`<h2 class="reminder-heading">🔔 全ゲームに未完了の日課があります</h2>
          <div class="reminder-item"><div class="reminder-title">${gameCount}ゲーム・残り${undone.length}件
            <span class="reminder-chip">${weeklyToday?'デイリー＋ウィークリー':'デイリー'} ${escapeHTML(notifySettings.dailyTime)}</span></div>
          <div class="reminder-sub">${escapeHTML(undone.slice(0,3).map(x=>`${x.game.name}: ${x.title}`).join('、'))}${undone.length>3?' ほか':''}</div>
          <div class="reminder-actions">
            <button type="button" class="btn btn-primary" data-action="show-global-reminders">未完了の日課を見る</button>
            <button type="button" class="btn" data-action="dismiss-global-reminder" data-key="${escapeHTML(key)}">今回の通知を閉じる</button>
          </div></div>`;
        return;
      }
      const alerts=games.flatMap(g=>reminderRules(g,now).map(r=>reminderStatus(g,r.kind,now))).filter(Boolean);
      node.hidden=!alerts.length;
      if(!alerts.length){node.innerHTML='';return}
      node.innerHTML=`<h2 class="reminder-heading">🔔 指定時刻を過ぎた未完了の日課があります</h2>`+alerts.map(({game,kind,undone,time})=>`
        <div class="reminder-item">
          <div class="reminder-top"><div class="reminder-title">${escapeHTML(game.name)}<span class="reminder-chip">${kind==='daily'?'デイリー':kind==='weekly'?'ウィークリー':'まとめて'} ${escapeHTML(time)}</span></div></div>
          <div class="reminder-sub">残り ${undone.length} 件：${escapeHTML(undone.slice(0,3).map(t=>t.title).join('、'))}${undone.length>3?' ほか':''}</div>
          <div class="reminder-actions">
            <button class="btn btn-primary" type="button" data-action="show-reminder-game" data-game="${escapeHTML(game.id)}">日課を確認</button>
            <button class="btn" type="button" data-action="dismiss-reminder" data-game="${escapeHTML(game.id)}" data-kind="${kind}">今回の通知を閉じる</button>
          </div>
        </div>`).join('');
    }
    function visibleTasks(g){return g.tasks.filter(t=>prefs.filter==='all'||t.repeat===prefs.filter)}
    function taskStats(tasks,g,now=new Date()){
      return {total:tasks.length,done:tasks.filter(t=>isDone(g,t,now)).length};
    }
    function fullStats(now=new Date(),view='all'){
      let done=0,total=0,finishedGames=0,activeGames=0;
      for(const g of games){
        const active=g.tasks.filter(t=>view==='all'?t.repeat==='daily'||t.repeat==='weekly':t.repeat===view);
        const stats=taskStats(active,g,now);
        done+=stats.done;total+=stats.total;
        if(stats.total>0){activeGames++;if(stats.done===stats.total)finishedGames++;}
      }
      return {done,total,finishedGames,activeGames};
    }
    function signature(now=new Date()){
      return games.map(g=>g.id+':'+cycleKey(g,'daily',now)+':'+cycleKey(g,'weekly',now)).join('|');
    }
    function notice(msg){
      const node=$('#toast');if(!node)return;
      node.textContent=msg;node.classList.add('show');clearTimeout(toastTimer);
      toastTimer=setTimeout(()=>node.classList.remove('show'),2700);
    }
    function render(now=new Date()){
      lastSignature=signature(now);
      $('#headerDate').textContent=new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'long'}).format(now);
      const summaryView=prefs.summaryView || 'daily';
      const s=fullStats(now,summaryView),percentage=s.total?Math.round(s.done/s.total*100):0;
      const summaryLabels={daily:'デイリー',weekly:'ウィークリー',all:'全体'};
      $('#heroEyebrow').textContent={daily:'DAILY QUESTS',weekly:'WEEKLY QUESTS',all:'ALL QUESTS'}[summaryView];
      document.querySelectorAll('[data-summary]').forEach(btn=>{
        const active=btn.dataset.summary===summaryView;
        btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',String(active));
      });
      $('#totalStats').innerHTML=`${s.done} <span>/ ${s.total} 完了</span>`;
      $('#heroNote').textContent=s.activeGames?`${s.finishedGames} / ${s.activeGames} ゲームの${summaryLabels[summaryView]}日課を完了`:(games.length?'この種類の日課はまだありません':'まずはゲームを追加してみましょう');
      $('#heroPercent').textContent=`${percentage}%`;
      $('#heroMeter').style.setProperty('--pct',percentage+'%');
      $('#dailyInfo').textContent=s.total>0&&s.done===s.total?`✨ ${summaryLabels[summaryView]}の日課をすべて達成！`:summaryView==='all'?'☀ デイリー＋ウィークリー（固定は除外）':`☀ ${summaryLabels[summaryView]}のみ集計中`;
      $('#gameCount').textContent=`${games.length} 件`;
      renderPassSummary(now);
      $('#hideDone').checked=prefs.hideDone;
      document.querySelectorAll('[data-filter]').forEach(btn=>{
        const active=btn.dataset.filter===prefs.filter;
        btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',String(active));
      });
      const allCollapsed=games.length>0 && games.every(g=>collapsed.has(g.id));
      $('#collapseButton').textContent=allCollapsed?'すべて開く':'すべて閉じる';
      $('#collapseButton').style.display=games.length?'':'none';
      const wrap=$('#games');
      if(!games.length){
        wrap.innerHTML=`<div class="empty"><div class="empty-icon">🗓️</div><h2>日課の管理を始めよう</h2><p>ゲームと日課を一度登録すれば、あとは毎日チェックするだけ。更新時刻に合わせて自動で未完了に戻ります。</p><button class="btn btn-primary" data-action="new-game">＋ 最初のゲームを登録</button><p style="margin:16px auto 0;font-size:11px">試したい場合は「設定」からサンプルを追加できます。</p></div>`;
        renderAlerts(now);
        return;
      }
      const list=games.map(g=>{
        const matching=visibleTasks(g);
        const shown=prefs.hideDone?matching.filter(t=>!isDone(g,t,now)):matching;
        const progress=taskStats(matching,g,now);
        const pct=progress.total?Math.round(progress.done/progress.total*100):0;
        const complete=progress.total>0 && progress.done===progress.total;
        const closed=collapsed.has(g.id);
        const rows=shown.map(t=>{
          const done=isDone(g,t,now);
          const label=t.repeat==='daily'?'毎日':t.repeat==='weekly'?'毎週':'固定';
          return `<div class="task ${done?'is-checked':''}">
            <button class="task-check" type="button" data-action="toggle-task" data-game="${escapeHTML(g.id)}" data-task="${escapeHTML(t.id)}" role="checkbox" aria-checked="${done}" aria-label="${escapeHTML(t.title)} ${done?'完了':'未完了'}">
              <span class="check-box" aria-hidden="true">${done?'✓':''}</span><span class="task-name">${escapeHTML(t.title)}</span>
            </button>
            <span class="task-tag">${label}</span>
            <button type="button" class="task-edit" data-action="edit-task" data-game="${escapeHTML(g.id)}" data-task="${escapeHTML(t.id)}" aria-label="${escapeHTML(t.title)}を編集">⋯</button>
          </div>`;
        }).join('');
        return `<section class="game ${complete?'is-done':''} ${closed?'game-closed':''}" data-id="${escapeHTML(g.id)}">
          <div class="game-head">
            <span class="game-emoji" style="--game-tone:${safeColor(g.color)}" aria-hidden="true">${iconMarkup(g)}</span>
            <div class="game-heading"><div class="game-name">${escapeHTML(g.name)}</div><div class="game-meta">毎日 ${g.resetTime} 更新 ｜ 毎週 ${dayNames[g.weeklyDay]}曜更新${safeReminderTime(g.reminderTime)?` ｜ 🔔毎日 ${escapeHTML(g.reminderTime)}`:''}${safeReminderTime(g.weeklyReminderTime)?` ｜ 🔔毎週${dayNames[safeDay(g.weeklyReminderDay ?? g.weeklyDay)]}曜 ${escapeHTML(g.weeklyReminderTime)}`:''}</div></div>
            <div class="game-head-buttons">
              <button class="game-mini" type="button" data-action="edit-game" data-game="${escapeHTML(g.id)}" aria-label="${escapeHTML(g.name)}の設定">⚙</button>
              <button class="game-mini" type="button" data-action="collapse" data-game="${escapeHTML(g.id)}" aria-expanded="${!closed}" aria-label="${escapeHTML(g.name)}の項目を${closed?'表示':'閉じる'}">${closed?'⌄':'⌃'}</button>
            </div>
          </div>
          <div class="game-body">
            <div class="game-progress"><div class="bar"><span style="width:${pct}%"></span></div><span class="game-progress-text">${progress.done} / ${progress.total} ${complete?'✓':''}</span></div>
            <div class="task-list">${rows || `<div class="no-tasks">${prefs.hideDone&&matching.length?'表示する未完了の日課はありません 🌟':matching.length?'この種類の日課はありません':'日課を追加しましょう'}</div>`}</div>
            <button class="add-task" data-action="new-task" data-game="${escapeHTML(g.id)}" type="button">＋ 日課を追加</button>
          </div>
        </section>`;
      });
      wrap.innerHTML=list.join('');
      renderAlerts(now);
    }
    function modal(html){
      $('#modalRoot').innerHTML=`<div class="modal-overlay" id="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">${html}</section></div>`;
      document.body.style.overflow='hidden';
      const input=$('#overlay [autofocus]');if(input)setTimeout(()=>input.focus({preventScroll:true}),50);
    }
    function closeModal(){
      cancelIconCrop();
      $('#modalRoot').innerHTML='';document.body.style.overflow='';
    }
    function listPasses(){
      return games.flatMap(g=>(g.passes||[]).map(pass=>({g,pass})))
        .sort((a,b)=>a.pass.expires.localeCompare(b.pass.expires));
    }
    function renderPassSummary(now=new Date()){
      const node=$('#passesSummary');if(!node)return;
      const all=listPasses();
      if(!all.length){node.textContent='期限を登録して更新忘れを防ごう';return;}
      const active=all.filter(x=>x.pass.enabled),soon=active.filter(x=>remainingDays(x.pass.expires,now)>=0&&remainingDays(x.pass.expires,now)<=7);
      const past=active.filter(x=>remainingDays(x.pass.expires,now)<0);
      node.textContent=`登録${all.length}件 ・ ${past.length?'期限切れ'+past.length+'件 ・ ':''}${soon.length?'7日以内 '+soon.length+'件':'期限が近い月パスはありません'}`;
    }
    function passListModal(){
      const all=listPasses();
      modal(`<div class="modal-header"><h2 id="modalTitle">🎫 月パス・更新リマインダー</h2><button type="button" class="btn btn-icon btn-ghost" data-action="close-modal" aria-label="閉じる">×</button></div>
        <p class="section-help">ゲームの月パスや有効期限を管理します。デイリーの達成率には含みません。更新日は自動変更されず、実際に購入・更新したら次の期限を登録してください。</p>
        <button type="button" class="btn btn-primary" data-action="new-pass" ${games.length?'':'disabled'}>＋ 月パスを登録</button>
        ${games.length?'':'<p class="section-help">先にゲームを登録してください。</p>'}
        ${all.map(({g,pass})=>{

    function drawIconCrop(){
      const state=cropState, canvas=$('#iconCropCanvas');if(!state||!canvas)return;
      const size=canvas.width, w=state.img.naturalWidth,h=state.img.naturalHeight;
      const scale=Math.max(size/w,size/h)*state.zoom;
      const sw=w*scale,sh=h*scale;
      state.x=Math.max((size-sw)/2,Math.min((sw-size)/2,state.x));
      state.y=Math.max((size-sh)/2,Math.min((sh-size)/2,state.y));
      const ctx=canvas.getContext('2d');if(!ctx)return;
      ctx.clearRect(0,0,size,size);
      ctx.drawImage(state.img,(size-sw)/2+state.x,(size-sh)/2+state.y,sw,sh);
    }
    async function openIconCrop(file){
      if(!file||!file.type.startsWith('image/'))throw Error('画像ファイルを選んでください');
      if(file.size>12_000_000)throw Error('12MB以下の画像を選んでください');
      cancelIconCrop();
      const form=$('#gameForm');if(!form)return;
      imageProcessing=true;updateIconPreview();
      const state={url:URL.createObjectURL(file),img:new Image(),zoom:1,x:0,y:0,drag:null};
      cropState=state;
      try{
        await new Promise((resolve,reject)=>{
          state.img.onload=resolve;
          state.img.onerror=()=>reject(Error('画像を読み込めませんでした。JPEGやPNGをお試しください'));
          state.img.src=state.url;
        });
        if(cropState!==state||$('#gameForm')!==form)return;
        if(!state.img.naturalWidth||!state.img.naturalHeight)throw Error('画像サイズを読み取れませんでした');
        $('#iconCropArea').hidden=false;
        $('#iconCropZoom').value='1';
        const canvas=$('#iconCropCanvas');
        canvas.addEventListener('pointerdown',e=>{
          if(cropState!==state)return;
          e.preventDefault();canvas.setPointerCapture(e.pointerId);
          state.drag={id:e.pointerId,x:e.clientX,y:e.clientY};
        });
        canvas.addEventListener('pointermove',e=>{
          if(cropState!==state||!state.drag||state.drag.id!==e.pointerId)return;
          e.preventDefault();
          const factor=canvas.width/canvas.getBoundingClientRect().width;
          state.x+=(e.clientX-state.drag.x)*factor;
          state.y+=(e.clientY-state.drag.y)*factor;
          state.drag.x=e.clientX;state.drag.y=e.clientY;
          drawIconCrop();
        });
        const done=e=>{if(state.drag?.id===e.pointerId)state.drag=null};
        canvas.addEventListener('pointerup',done);
        canvas.addEventListener('pointercancel',done);
        $('#iconCropZoom').addEventListener('input',e=>{
          if(cropState!==state)return;
          state.zoom=Number(e.target.value);drawIconCrop();
        });
        drawIconCrop();
        $('#iconHint').textContent='写真の位置と拡大率を調整して「この範囲で切り抜く」を押してください。';
      }catch(err){if(cropState===state)cancelIconCrop();throw err;}
    }
    function cropImageData(canvas){
      for(const size of [256,192,144]){
        const output=document.createElement('canvas');output.width=output.height=size;
        const ctx=output.getContext('2d');if(!ctx)throw Error('画像の加工に対応していません');
        ctx.drawImage(canvas,0,0,size,size);
        for(const quality of [.82,.65,.45]){
          let data=output.toDataURL('image/webp',quality);
          if(!data.startsWith('data:image/webp;base64,')){
            ctx.globalCompositeOperation='destination-over';
            ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);
            data=output.toDataURL('image/jpeg',quality);
          }
          if(safeIconImage(data))return data;
        }
      }
      throw Error('画像を縮小できませんでした。別の画像をお試しください');
    }

        notice('切り抜きました。「ゲームを保存」で確定します');
      }catch(err){alert(err.message||'画像の加工に失敗しました')}
    }

    function handleToggle(gameId,taskId){
      const g=games.find(x=>x.id===gameId);const t=g?.tasks.find(x=>x.id===taskId);if(!t)return;
      const key=cycleKey(g,t.repeat);const found=t.doneKeys.indexOf(key);
      if(found>=0)t.doneKeys.splice(found,1);
      else t.doneKeys.push(key);
      if(t.doneKeys.length>400)t.doneKeys=t.doneKeys.slice(-400);
      save();render();
    }
    function exportData(){
      const blob=new Blob([JSON.stringify({app:'デイリーボード',version:1,exportedAt:new Date().toISOString(),games,notificationSettings:notifySettings},null,2)],{type:'application/json;charset=utf-8'});
      const url=URL.createObjectURL(blob);
      const link=document.createElement('a');link.href=url;link.download=`daily-board-backup-${ymd(new Date())}.json`;
      document.body.appendChild(link);link.click();link.remove();
      setTimeout(()=>URL.revokeObjectURL(url),30000);
      notice('バックアップファイルを作成しました');
    }
    async function importData(file){
      if(!file)return;
      if(file.size>8_000_000){notice('ファイルが大きすぎます');return}
      try{
        const obj=JSON.parse(await file.text());const normalized=normalize(obj);
        if(!confirm(`${normalized.games.length} 件のゲームを復元します。現在のデータは上書きされます。続けますか？`))return;
        const before=games;
        games=normalized.games;
        if(!save()){
          games=before;
          alert('バックアップを保存できませんでした。ブラウザの空き容量などを確認してください。');
          return;
        }
        if(obj.notificationSettings){notifySettings=safeNotifySettings(obj.notificationSettings);saveNotifySettings();}
        collapsed.clear();closeModal();render();notice('バックアップを復元しました');
      }catch(err){console.error(err);alert('バックアップを読み込めませんでした。正しいJSONファイルか確認してください。');}
    }
    document.addEventListener('click',event=>{
      const btn=event.target.closest('[data-action]');
      if(!btn){if(event.target.id==='overlay')closeModal();return;}
      const a=btn.dataset.action,g=btn.dataset.game,t=btn.dataset.task;
      if(a==='close-modal')closeModal();
      if(a==='new-game')gameModal();
      if(a==='pass-list')passListModal();
      if(a==='new-pass')passEditModal();
      if(a==='edit-pass'||a==='renew-pass')passEditModal(g,btn.dataset.pass,a==='renew-pass');
      if(a==='delete-pass'){
        const game=games.find(x=>x.id===g),pass=game?.passes?.find(x=>x.id===btn.dataset.pass);
        if(pass&&confirm(`「${game.name}」の「${pass.name}」の期限登録を削除しますか？`)){
          game.passes=game.passes.filter(x=>x.id!==pass.id);
          if(save()){render();passListModal();notice('月パスを削除しました');}
        }
      }
      if(a==='edit-game')gameModal(g);
      if(a==='new-task')taskModal(g);
      if(a==='edit-task')taskModal(g,t);
      if(a==='toggle-task')handleToggle(g,t);
      if(a==='collapse'){collapsed.has(g)?collapsed.delete(g):collapsed.add(g);render()}
      if(a==='show-global-reminders'){
        prefs.filter='all';prefs.hideDone=true;collapsed.clear();savePrefs();render();
        document.querySelector('#games')?.scrollIntoView({behavior:'smooth',block:'start'});
      }
      if(a==='dismiss-global-reminder'){
        dismissedReminders['__global__']=btn.dataset.key;saveDismissed();renderAlerts();
      }
      if(a==='dismiss-reminder'){
        const target=games.find(x=>x.id===g),kind=btn.dataset.kind;
        const state=target?reminderStatus(target,kind):null;
        if(state){dismissedReminders[g+'|'+kind]=state.key;saveDismissed();renderAlerts();}
      }
      if(a==='show-reminder-game'){
        collapsed.delete(g);prefs.filter='all';prefs.hideDone=true;savePrefs();render();
        const element=Array.from(document.querySelectorAll('.game')).find(el=>el.dataset.id===g);
        if(element)element.scrollIntoView({behavior:'smooth',block:'start'});
      }
      if(a==='select-color'){
        $('#gameColor').value=btn.dataset.color;
        if($('#gameIconPreview'))$('#gameIconPreview').style.setProperty('--game-tone',btn.dataset.color);
        document.querySelectorAll('.swatch').forEach(s=>{const active=s===btn;s.classList.toggle('selected',active);s.setAttribute('aria-pressed',String(active))});
      }
      if(a==='remove-icon-image'){cancelIconCrop();pendingIconImage='';updateIconPreview()}
      if(a==='cancel-icon-crop')cancelIconCrop();
      if(a==='apply-icon-crop')applyIconCrop();
      if(a==='delete-game'){
        const target=games.find(x=>x.id===g);
        if(target&&confirm(`「${target.name}」と登録された日課をすべて削除しますか？\nこの操作は取り消せません。`)){
          games=games.filter(x=>x.id!==g);collapsed.delete(g);save();closeModal();render();notice('ゲームを削除しました');
        }
      }
      if(a==='delete-task'){
        const target=games.find(x=>x.id===g),task=target?.tasks.find(x=>x.id===t);
        if(target&&task&&confirm(`「${task.title}」を削除しますか？`)){
          target.tasks=target.tasks.filter(x=>x.id!==t);save();closeModal();render();notice('日課を削除しました');
        }
      }
      if(a==='export')exportData();
      if(a==='import')$('#importFile').click();
      if(a==='sample')addSample();
    });
    document.addEventListener('input',event=>{
      if(event.target.id==='gameIcon')updateIconPreview();
    });
    document.addEventListener('change',async event=>{
      if(event.target.id==='notifyScope'){
        const panel=$('#notifyAllPanel');if(panel)panel.hidden=event.target.value!=='all';return;
      }
      if(event.target.id==='notifyAllWeekly'){
        const panel=$('#notifyAllWeeklyArea');if(panel)panel.hidden=!event.target.checked;return;
      }
      if(event.target.id!=='gameIconFile')return;
      const file=event.target.files?.[0];
      if(!file)return;
      try{await openIconCrop(file)}
      catch(err){alert(err.message||'画像を読み込めませんでした')}
      finally{event.target.value=''}
    });
    document.addEventListener('submit',event=>{
      event.preventDefault();
      if(event.target.id==='notificationSettingsForm'){
        const candidate=safeNotifySettings({scope:$('#notifyScope').value,
          dailyTime:$('#notifyAllDailyTime').value,
          weeklyDay:Number($('#notifyAllWeeklyDay').value),
          includeWeekly:$('#notifyAllWeekly').checked});
        notifySettings=candidate;
        if(saveNotifySettings()){
          render();closeModal();notice(candidate.scope==='all'?'全ゲーム一括通知に設定しました':'ゲームごとの通知に設定しました');
        }
        return;
      }
      if(event.target.id==='passForm'){
        const current=games.find(x=>x.id===event.target.dataset.game);
        const dest=games.find(x=>x.id===$('#passGame').value);
        const existing=(current?.passes||[]).find(x=>x.id===event.target.dataset.pass);
        const expires=$('#passExpires').value;
        if(!dest||!validDate(expires)){notice('有効期限を正しく入力してください');return;}
        const name=$('#passName').value.trim();
        if(!name){notice('月パスの名前を入力してください');return;}
        const pass={id:existing?.id||newId(),name:name.slice(0,60),expires,remindTime:safeReminderTime($('#passTime').value)||'20:00',leadDays:VALID_LEADS.filter(x=>Array.from(document.querySelectorAll('[name="passLead"]:checked')).some(e=>Number(e.value)===x)),enabled:$('#passEnabled').checked};
        if(!existing&&(dest.passes||[]).length>=30){notice('1ゲームにつき30件まで登録できます');return;}
        const before=JSON.stringify(games);
        if(existing)Object.assign(existing,pass);
        else{dest.passes ||= [];dest.passes.push(pass);}
        if(!save()){games=JSON.parse(before);return;}
        render();passListModal();notice('月パスの期限を保存しました');return;
      }
      if(event.target.id==='gameForm'){
        const id=event.target.dataset.id,name=$('#gameName').value.trim();
        if(!name){notice('ゲーム名を入力してください');return}
        if(imageProcessing){notice('画像の読み込みが終わってから保存してください');return}
        const payload={name,icon:$('#gameIcon').value.trim()||'🎮',iconImage:pendingIconImage,color:safeColor($('#gameColor').value),resetTime:safeTime($('#resetTime').value),reminderTime:safeReminderTime($('#reminderTime').value),weeklyDay:safeDay($('#weeklyDay').value),weeklyReminderTime:safeReminderTime($('#weeklyReminderTime').value),weeklyReminderDay:safeDay($('#weeklyReminderDay').value)};
        // 容量制限で保存できなかった場合は変更を取り消す。
        const oldGames=JSON.stringify(games);
        if(id){const g=games.find(x=>x.id===id);if(g)Object.assign(g,payload)}
        else games.push({id:newId(),...payload,tasks:[]});
        if(!save()){
          games=JSON.parse(oldGames);
          alert('データを保存できませんでした。画像の数を減らすか、先にバックアップを保存してください。');
          return;
        }
        closeModal();render();notice(id?'ゲームを更新しました':'ゲームを追加しました');
      }
      if(event.target.id==='taskForm'){
        const gameId=event.target.dataset.game,taskId=event.target.dataset.id;
        const g=games.find(x=>x.id===gameId);if(!g)return;
        const title=$('#taskName').value.trim(),repeat=validRepeat($('#taskRepeat').value);
        if(!title){notice('日課の内容を入力してください');return}
        if(taskId){
          const task=g.tasks.find(x=>x.id===taskId);
          if(task){if(task.repeat!==repeat)task.doneKeys=[];task.title=title;task.repeat=repeat}
        }else g.tasks.push(makeTask(title,repeat));
        save();closeModal();collapsed.delete(gameId);render();notice(taskId?'日課を更新しました':'日課を追加しました');
      }
    });
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&$('#overlay'))closeModal()});
    $('#newGameButton').addEventListener('click',()=>gameModal());
    $('#monthlyPassButton').addEventListener('click',passListModal);
    $('#settingsButton').addEventListener('click',settingsModal);
    $('#backupFooter').addEventListener('click',settingsModal);
    $('#importFile').addEventListener('change',async event=>{await importData(event.target.files?.[0]);event.target.value=''});
    $('#collapseButton').addEventListener('click',()=>{
      const allCollapsed=games.length&&games.every(g=>collapsed.has(g.id));
      collapsed=allCollapsed?new Set():new Set(games.map(g=>g.id));render();
    });
    document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{
      prefs.filter=btn.dataset.filter;savePrefs();render();
    }));
    document.querySelectorAll('[data-summary]').forEach(btn=>btn.addEventListener('click',()=>{
      prefs.summaryView=btn.dataset.summary;savePrefs();render();
    }));
    $('#hideDone').addEventListener('change',event=>{prefs.hideDone=event.target.checked;savePrefs();render()});
    load();render();
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
    window.addEventListener('focus',()=>render());
    setInterval(()=>{
      const now=new Date();
      if(!document.hidden && (signature(now)!==lastSignature))render(now);
      else if(!document.hidden){$('#headerDate').textContent=new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'long'}).format(now);renderAlerts(now)}
    },15000);
  })();
  </script>
  <script src="./push-config.js"></script>
  <script src="./push-client.js"></script>
  <!-- オフライン対応：初回はインターネット接続が必要です -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.warn('PWAのオフライン登録に失敗しました:', err);
        });
      });
    }
  </script>
</body>
